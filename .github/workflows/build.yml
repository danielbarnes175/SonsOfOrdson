name: Build

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Tweego
        env:
          TWEEGO_VERSION: 2.1.1
        run: |
          curl -fsSL "https://github.com/tmedwards/tweego/releases/download/v${TWEEGO_VERSION}/tweego-${TWEEGO_VERSION}-linux-x64.zip" -o "$RUNNER_TEMP/tweego.zip"
          mkdir -p "$RUNNER_TEMP/tweego"
          unzip -q "$RUNNER_TEMP/tweego.zip" -d "$RUNNER_TEMP/tweego"
          chmod +x "$RUNNER_TEMP/tweego/tweego"
          echo "$RUNNER_TEMP/tweego" >> "$GITHUB_PATH"

      - name: Build game
        run: |
          mkdir -p dist/src
          tweego src/story src/js src/css src/macros -o dist/index.html --module=env-prod.js
          cp -R src/images dist/src/images

      - name: Deploy to Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
